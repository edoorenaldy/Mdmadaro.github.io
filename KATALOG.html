<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEKIRO Catalogue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
            background: #f7f7f7;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            background: #fff;
        }
        h1 { margin-bottom: 8px; }
        h2 { margin-top: 0; }
        ul {
            text-align: left;
            display: inline-block;
            margin: 10px auto;
        }
        .pdf-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }
        .pdf-button:hover { opacity: 0.85; }
        .catalog-note {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>TEKIRO Catalogue</h1>

    <div class="container">
        <h2>AU-LS2042 TEKIRO</h2>
        <p><strong>Spesifikasi:</strong></p>
        <ul>
            <li>Jenis: Wrench Set</li>
            <li>Brand: TEKIRO</li>
            <li>Model: AU-LS2042</li>
        </ul>
        <p class="catalog-note">Klik tombol di bawah untuk membuka katalog PDF TEKIRO.</p>
        <a class="pdf-button"
           href="TEKIRO_CATALOGUE.pdf"
           target="_blank"
           rel="noopener">
            Lihat Katalog PDF
        </a>
    </div>
</body>
</html>
