name: Build material catalogue images

on:
  push:
    branches:
      - main
    paths:
      - "scripts/build_material_images.py"
      - ".github/workflows/material-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: material-catalogue-images
  cancel-in-progress: false

jobs:
  download-compress-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --upgrade pip requests pillow

      - name: Download and optimize material images
        run: python scripts/build_material_images.py

      - name: Commit images to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/*.jpg assets/images/MATERIAL_IMAGE_SOURCES.csv
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Add 148 compressed material catalogue images"
          git push origin HEAD:main
