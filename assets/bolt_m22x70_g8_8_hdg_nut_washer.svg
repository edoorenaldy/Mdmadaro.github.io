<svg xmlns="http://www.w3.org/2000/svg" width="800" height="533" viewBox="0 0 800 533">
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f4f4"/><stop offset=".28" stop-color="#9b9b9b"/><stop offset=".5" stop-color="#eeeeee"/><stop offset=".72" stop-color="#777"/><stop offset="1" stop-color="#d8d8d8"/></linearGradient>
<linearGradient id="darkmetal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9e9e9"/><stop offset=".5" stop-color="#8c8c8c"/><stop offset="1" stop-color="#cfcfcf"/></linearGradient>
